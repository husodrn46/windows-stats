[ai]
desc = "Kad darbojas lokāls MI modelis (Ollama, llama.cpp, KoboldCpp, LocalAI), Windows Stats to pamana un piefiksē, cik intensīvi dators tikmēr strādā: augstāko procesora, videokartes, videoatmiņas un atmiņas noslodzi, kā arī augstākās temperatūras. Sesijas tiek glabātas tikai šajā datorā; modeļa nosaukums tiek vaicāts no pašas programmas lokālās adreses (127.0.0.1)."
watch = "Sekot lokālām MI sesijām"
watch_desc = "Ik pēc dažām sekundēm pārbauda palaisto programmu sarakstu, lai pamanītu modeli. Vairāk programmu var pievienot failā config.toml (ai_processes)."
sessions = "Nesenās sesijas"
now = "Pašlaik darbojas: {name}"
none_yet = "Sesiju vēl nav. Palaidiet modeli, un Windows Stats to šeit piefiksēs."
none_off = "Sekošana ir izslēgta."
none_unasked = "Vēl nav jautāts: Windows Stats jautās, kad pirmo reizi darbosies lokāls modelis."
clear = "Dzēst saglabātās sesijas"
mcp = "Savienojums MI lietotnēm (MCP)"
mcp_desc = "MI lietotnes, kas atbalsta MCP (LM Studio, Claude Desktop, VS Code un citas), var no Windows Stats nolasīt šī datora noslodzi un šīs sesijas tikai lasīšanas režīmā. Nokopējiet iestatījumu un ielīmējiet to lietotnes MCP iestatījumos (mcpServers); lietotne palaiž Windows Stats ar --mcp, kad tai tas vajadzīgs, un neviens tīkla ports netiek atvērts. Programmu nosaukumi tiek iegūti tikai no rīka top_processes; ja izmanto mākoņa modeli, tie tiek nosūtīti šim pakalpojumam."
mcp_copy = "Kopēt MCP iestatījumu"
mcp_copied = "MCP iestatījums nokopēts. Ielīmējiet to savas MI lietotnes MCP iestatījumos."
mcp_copy_failed = "Starpliktuvi nevarēja izmantot."
started_title = "Darbojas: {name}"
started_body = "Windows Stats seko šai sesijai un, kad tā beigsies, parādīs kopsavilkumu."
ended_title = "Pabeigts: {name}"
ask = "Darbojas lokāls MI modelis ({runtime}).\n\nVai Windows Stats jāseko šādām sesijām un, kamēr darbojas modelis, jāpiefiksē augstākā procesora, videokartes, videoatmiņas un atmiņas noslodze, kā arī augstākās temperatūras? Sesijas tiek glabātas tikai šajā datorā. Lai parādītu modeļa nosaukumu, Windows Stats vaicā programmai tās pašas lokālajā adresē (127.0.0.1); nekas neatstāj datoru.\n\nTo varat mainīt sadaļā Iestatījumi > Mākslīgais intelekts."
