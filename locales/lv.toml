[news]
title = "Jaunumi Windows Stats {version}"
body = "Brīdinājumos tagad norādīta programma, kas tos izraisa. Jauni brīdinājumi, kas ir izslēgti, līdz tos ieslēgsiet: ilgi izmantots mikrofons vai kamera, programma, kuras atmiņa nepārtraukti aug, gandrīz pilns disks. Noklikšķiniet, lai tos iestatītu."
