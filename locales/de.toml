[ai]
desc = "Wenn ein lokales KI-Modell läuft (Ollama, llama.cpp, KoboldCpp, LocalAI), erkennt Windows Stats das und hält fest, wie stark der Computer währenddessen arbeitet: die Höchstwerte für CPU, GPU, Grafikspeicher, Arbeitsspeicher und Temperaturen. Sitzungen werden nur auf diesem Computer gespeichert; der Name des Modells wird über die eigene lokale Adresse des Programms (127.0.0.1) abgefragt."
watch = "Lokale KI-Sitzungen verfolgen"
watch_desc = "Prüft alle paar Sekunden die Liste der laufenden Programme, um ein Modell zu erkennen. Weitere Programme können in config.toml (ai_processes) hinzugefügt werden."
sessions = "Letzte Sitzungen"
now = "Läuft gerade: {name}"
none_yet = "Noch keine Sitzungen. Starten Sie ein Modell, und Windows Stats hält es hier fest."
none_off = "Verfolgung ist aus."
none_unasked = "Noch nicht gefragt: Windows Stats fragt, wenn zum ersten Mal ein lokales Modell läuft."
clear = "Gespeicherte Sitzungen löschen"
mcp = "Verbindung für KI-Apps (MCP)"
mcp_desc = "KI-Apps mit MCP-Unterstützung (LM Studio, Claude Desktop, VS Code und andere) können die Auslastung dieses Computers und diese Sitzungen schreibgeschützt aus Windows Stats lesen. Kopieren Sie die Einrichtung und fügen Sie sie in die MCP-Einstellungen der App ein (mcpServers); die App startet Windows Stats bei Bedarf mit --mcp, und es wird kein Netzwerkport geöffnet. Programmnamen liefert nur das Tool top_processes; bei einem Cloud-Modell werden sie an diesen Dienst gesendet."
mcp_copy = "MCP-Einrichtung kopieren"
mcp_copied = "MCP-Einrichtung kopiert. Fügen Sie sie in die MCP-Einstellungen Ihrer KI-App ein."
mcp_copy_failed = "Die Zwischenablage konnte nicht verwendet werden."
started_title = "{name} läuft"
started_body = "Windows Stats verfolgt diese Sitzung und zeigt nach ihrem Ende eine Zusammenfassung."
ended_title = "{name} beendet"
ask = "Ein lokales KI-Modell läuft ({runtime}).\n\nSoll Windows Stats solche Sitzungen verfolgen und die Höchstwerte für CPU, GPU, Grafikspeicher, Arbeitsspeicher und Temperaturen festhalten, während ein Modell läuft? Sitzungen werden nur auf diesem Computer gespeichert. Um den Namen des Modells anzuzeigen, fragt Windows Stats das Programm unter seiner eigenen lokalen Adresse (127.0.0.1) ab; nichts verlässt den Computer.\n\nSie können das unter Einstellungen > KI ändern."
