[news]
title = "Neu in Windows Stats {version}"
body = "Warnungen nennen jetzt das verantwortliche Programm. Neue Warnungen, die erst aktiv sind, wenn Sie sie einschalten: Mikrofon oder Kamera lange in Benutzung, ein Programm, dessen Speicher ständig wächst, ein fast voller Datenträger. Klicken Sie, um sie einzurichten."
