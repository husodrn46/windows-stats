[ai]
desc = "Når en lokal KI-modell kjører (Ollama, llama.cpp, KoboldCpp, LocalAI), oppdager Windows Stats det og noterer hvor hardt datamaskinen jobber imens: de høyeste verdiene for prosessor, grafikkort, grafikkminne, minne og temperaturer. Økter lagres bare på denne datamaskinen; modellnavnet hentes fra programmets egen lokale adresse (127.0.0.1)."
watch = "Følg lokale KI-økter"
watch_desc = "Ser på listen over kjørende programmer med noen sekunders mellomrom for å oppdage en modell. Flere programmer kan legges til i config.toml (ai_processes)."
