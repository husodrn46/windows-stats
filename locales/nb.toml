started_body = "Windows Stats følger denne økten og viser et sammendrag når den er ferdig."
ended_title = "{name} er ferdig"
ask = "En lokal KI-modell kjører ({runtime}).\n\nSkal Windows Stats følge økter som denne og notere de høyeste verdiene for prosessor, grafikkort, grafikkminne, minne og temperaturer mens en modell kjører? Økter lagres bare på denne datamaskinen. For å vise modellnavnet spør Windows Stats programmet på dets egen lokale adresse (127.0.0.1); ingenting forlater datamaskinen.\n\nDu kan endre dette i Innstillinger > KI."
