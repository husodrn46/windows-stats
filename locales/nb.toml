now = "Kjører nå: {name}"
none_yet = "Ingen økter ennå. Kjør en modell, så noterer Windows Stats den her."
none_off = "Oppfølging er slått av."
none_unasked = "Ikke spurt ennå: Windows Stats spør første gang en lokal modell kjører."
clear = "Slett de lagrede øktene"
mcp = "Tilkobling for KI-apper (MCP)"
mcp_desc = "KI-apper som støtter MCP (LM Studio, Claude Desktop, VS Code og andre), kan lese belastningen på denne datamaskinen og disse øktene fra Windows Stats, skrivebeskyttet. Kopier oppsettet og lim det inn i MCP-innstillingene i appen (mcpServers); appen starter Windows Stats med --mcp når den trenger det, og ingen nettverksport åpnes. Programnavn kommer bare fra verktøyet top_processes; med en skymodell sendes de til den tjenesten."
mcp_copy = "Kopier MCP-oppsettet"
mcp_copied = "MCP-oppsettet er kopiert. Lim det inn i MCP-innstillingene i KI-appen din."
