[news]
title = "Kas naujo Windows Stats {version}"
body = "Įspėjimuose dabar nurodoma juos sukėlusi programa. Nauji įspėjimai, išjungti, kol jų neįjungsite: ilgai naudojamas mikrofonas ar kamera, programa, kurios atmintis vis auga, beveik pilnas diskas. Spustelėkite, kad juos nustatytumėte."
