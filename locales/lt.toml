[ai]
desc = "Kai veikia vietinis DI modelis (Ollama, llama.cpp, KoboldCpp, LocalAI), Windows Stats tai pastebi ir užfiksuoja, kiek tuo metu dirba kompiuteris: didžiausią procesoriaus, vaizdo plokštės, vaizdo atminties ir atminties apkrovą bei aukščiausias temperatūras. Seansai saugomi tik šiame kompiuteryje; modelio pavadinimo klausiama pačios programos vietiniu adresu (127.0.0.1)."
watch = "Stebėti vietinius DI seansus"
watch_desc = "Kas kelias sekundes peržiūri veikiančių programų sąrašą, kad pastebėtų modelį. Daugiau programų galima įtraukti faile config.toml (ai_processes)."
sessions = "Naujausi seansai"
now = "Dabar veikia: {name}"
none_yet = "Seansų dar nėra. Paleiskite modelį ir Windows Stats jį čia užfiksuos."
none_off = "Stebėjimas išjungtas."
none_unasked = "Dar nepaklausta: Windows Stats paklaus, kai pirmą kartą veiks vietinis modelis."
clear = "Panaikinti įrašytus seansus"
mcp = "Ryšys su DI programomis (MCP)"
mcp_desc = "MCP palaikančios DI programos (LM Studio, Claude Desktop, VS Code ir kitos) gali iš Windows Stats skaityti šio kompiuterio apkrovą ir šiuos seansus, tik skaitymo režimu. Nukopijuokite sąranką ir įklijuokite ją į programos MCP parametrus (mcpServers); programa paleidžia Windows Stats su --mcp, kai jai to prireikia, ir joks tinklo prievadas neatidaromas. Programų pavadinimai gaunami tik iš įrankio top_processes; naudojant debesies modelį, jie siunčiami tai paslaugai."
mcp_copy = "Kopijuoti MCP sąranką"
mcp_copied = "MCP sąranka nukopijuota. Įklijuokite ją į savo DI programos MCP parametrus."
mcp_copy_failed = "Nepavyko pasiekti mainų srities."
started_title = "Veikia: {name}"
started_body = "Windows Stats stebi šį seansą ir jam pasibaigus parodys suvestinę."
ended_title = "Baigta: {name}"
ask = "Veikia vietinis DI modelis ({runtime}).\n\nAr Windows Stats turėtų stebėti tokius seansus ir užfiksuoti didžiausią procesoriaus, vaizdo plokštės, vaizdo atminties ir atminties apkrovą bei aukščiausias temperatūras, kol veikia modelis? Seansai saugomi tik šiame kompiuteryje. Kad parodytų modelio pavadinimą, Windows Stats klausia programos jos pačios vietiniu adresu (127.0.0.1); niekas neišeina už kompiuterio ribų.\n\nTai galite pakeisti per Parametrai > Dirbtinis intelektas."
