[ai]
desc = "Коли працює локальна модель ШІ (Ollama, llama.cpp, KoboldCpp, LocalAI), Windows Stats помічає це і записує, наскільки сильно в цей час навантажений комп'ютер: пікове навантаження процесора й відеокарти, відеопам'ять, пам'ять і температури. Сеанси зберігаються лише на цьому комп'ютері; назва моделі запитується за власною локальною адресою програми (127.0.0.1)."
watch = "Відстежувати локальні сеанси ШІ"
watch_desc = "Кожні кілька секунд переглядає список запущених програм, щоб помітити модель. Інші програми можна додати в config.toml (ai_processes)."
sessions = "Останні сеанси"
now = "Зараз працює: {name}"
none_yet = "Сеансів поки немає. Запустіть модель, і Windows Stats відзначить її тут."
none_off = "Відстеження вимкнено."
none_unasked = "Питання ще не поставлено: Windows Stats запитає, коли вперше запуститься локальна модель."
clear = "Видалити збережені сеанси"
mcp = "Підключення для застосунків ШІ (MCP)"
mcp_desc = "Застосунки ШІ з підтримкою MCP (LM Studio, Claude Desktop, VS Code та інші) можуть зчитувати з Windows Stats навантаження цього комп'ютера і ці сеанси, лише для читання. Скопіюйте конфігурацію і вставте її в налаштування MCP застосунку (mcpServers); застосунок запускає Windows Stats із --mcp, коли це потрібно, і мережевий порт не відкривається. Назви програм надходять лише від інструмента top_processes; у разі хмарної моделі вони надсилаються до цього сервісу."
mcp_copy = "Копіювати конфігурацію MCP"
