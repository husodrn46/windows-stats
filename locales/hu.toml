[ai]
desc = "Amikor egy helyi MI-modell fut (Ollama, llama.cpp, KoboldCpp, LocalAI), a Windows Stats észleli, és feljegyzi, mennyire dolgozik közben a számítógép: a processzor, a videokártya, a videomemória és a memória legnagyobb terhelését, valamint a legmagasabb hőmérsékleteket. A munkamenetek csak ezen a számítógépen tárolódnak; a modell nevét a program saját helyi címétől (127.0.0.1) kérdezi le."
watch = "Helyi MI-munkamenetek követése"
watch_desc = "Néhány másodpercenként átnézi a futó programok listáját, hogy észlelje a modelleket. További programok a config.toml fájlban adhatók meg (ai_processes)."
sessions = "Legutóbbi munkamenetek"
now = "Most fut: {name}"
none_yet = "Még nincsenek munkamenetek. Futtasson egy modellt, és a Windows Stats itt rögzíti."
none_off = "A követés ki van kapcsolva."
none_unasked = "Még nem volt kérdés: a Windows Stats akkor kérdez rá, amikor először fut helyi modell."
clear = "A mentett munkamenetek törlése"
mcp = "Kapcsolat MI-alkalmazásokhoz (MCP)"
mcp_desc = "Az MCP-t támogató MI-alkalmazások (LM Studio, Claude Desktop, VS Code és mások) a Windows Stats programon keresztül, csak olvasásra lekérhetik a számítógép terhelését és ezeket a munkameneteket. Másolja ki a beállítást, és illessze be az alkalmazás MCP-beállításaiba (mcpServers); az alkalmazás szükség esetén a --mcp kapcsolóval indítja el a Windows Stats programot, és nem nyílik meg hálózati port. A programnevek csak a top_processes eszközből származnak; felhőalapú modell esetén ezek eljutnak az adott szolgáltatáshoz."
mcp_copy = "Az MCP-beállítás másolása"
mcp_copied = "Az MCP-beállítás a vágólapra került. Illessze be az MI-alkalmazás MCP-beállításaiba."
