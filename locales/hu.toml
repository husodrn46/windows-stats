started_title = "Fut: {name}"
started_body = "A Windows Stats követi ezt a munkamenetet, és a végén összegzést mutat."
ended_title = "Véget ért: {name}"
ask = "Fut egy helyi MI-modell ({runtime}).\n\nKövesse a Windows Stats az ilyen munkameneteket, és jegyezze fel a processzor, a videokártya, a videomemória és a memória legnagyobb terhelését, valamint a legmagasabb hőmérsékleteket, amíg egy modell fut? A munkamenetek csak ezen a számítógépen tárolódnak. A modell nevének megjelenítéséhez a Windows Stats a program saját helyi címén (127.0.0.1) kérdez rá; semmi sem hagyja el a számítógépet.\n\nEzt a Beállítások > MI oldalon módosíthatja."
