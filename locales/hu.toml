[news]
title = "A Windows Stats {version} újdonságai"
body = "A figyelmeztetések mostantól megnevezik az okozó programot. Új figyelmeztetések, amelyek bekapcsolásig ki vannak kapcsolva: sokáig használt mikrofon vagy kamera, folyamatosan növekvő memóriájú program, majdnem megtelt lemez. Kattintson a beállításukhoz."
