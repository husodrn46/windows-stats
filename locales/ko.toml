ask = "Windows Stats에서 새 버전을 확인하시겠습니까?\n\n하루에 한 번 이하로 GitHub에 최신 릴리스 번호를 확인하고 새 버전을 사용할 수 있으면 알려 줍니다. 그러면 설정 > 정보에서 업데이트할 수 있습니다. GitHub에는 요청 자체(IP 주소와 Windows Stats 버전)만 보입니다. 설정, 측정값 또는 식별자는 전송되지 않습니다.\n\n이 설정은 언제든지 설정 > 개인 정보에서 변경할 수 있습니다."
toast_title = "Windows Stats {version}을(를) 사용할 수 있습니다"
toast_body = "클릭하여 설정 > 정보를 열고 업데이트하세요."

[ai]
desc = "로컬 AI 모델(Ollama, llama.cpp, KoboldCpp, LocalAI)이 실행되면 Windows Stats가 이를 감지하고 그동안 컴퓨터가 얼마나 바쁘게 일했는지, 즉 CPU, GPU, 비디오 메모리, 메모리 사용량과 온도의 최고값을 기록합니다. 세션은 이 컴퓨터에만 보관되며, 모델 이름은 해당 프로그램 자체의 로컬 주소(127.0.0.1)에 요청하여 가져옵니다."
watch = "로컬 AI 세션 추적"
watch_desc = "몇 초마다 실행 중인 프로그램 목록을 확인하여 모델을 감지합니다. config.toml(ai_processes)에서 프로그램을 더 추가할 수 있습니다."
sessions = "최근 세션"
now = "현재 실행 중: {name}"
none_yet = "아직 세션이 없습니다. 모델을 실행하면 Windows Stats가 여기에 기록합니다."
none_off = "추적이 꺼져 있습니다."
none_unasked = "아직 묻지 않았습니다. 로컬 모델이 처음 실행될 때 Windows Stats가 묻습니다."
clear = "저장된 세션 삭제"
mcp = "AI 앱 연결(MCP)"
mcp_desc = "MCP를 지원하는 AI 앱(LM Studio, Claude Desktop, VS Code 등)은 Windows Stats에서 이 컴퓨터의 부하와 이 세션들을 읽기 전용으로 읽을 수 있습니다. 설정을 복사하여 앱의 MCP 설정(mcpServers)에 붙여 넣으세요. 앱은 필요할 때 --mcp 옵션으로 Windows Stats를 시작하며 네트워크 포트는 열리지 않습니다. 프로그램 이름은 top_processes 도구에서만 제공되며, 클라우드 모델을 사용하면 해당 서비스로 전송됩니다."
mcp_copy = "MCP 설정 복사"
mcp_copied = "MCP 설정을 복사했습니다. AI 앱의 MCP 설정에 붙여 넣으세요."
mcp_copy_failed = "클립보드를 사용할 수 없습니다."
started_title = "{name} 실행 중"
started_body = "Windows Stats가 이 세션을 추적하고 세션이 끝나면 요약을 표시합니다."
ended_title = "{name} 종료됨"
ask = "로컬 AI 모델이 실행 중입니다({runtime}).\n\nWindows Stats에서 이런 세션을 추적하여 모델이 실행되는 동안의 최고 CPU, GPU, 비디오 메모리, 메모리 사용량과 온도를 기록하시겠습니까? 세션은 이 컴퓨터에만 보관됩니다. 모델 이름을 표시하기 위해 Windows Stats는 해당 프로그램 자체의 로컬 주소(127.0.0.1)로 요청하며, 컴퓨터 밖으로 나가는 데이터는 없습니다.\n\n설정 > AI에서 변경할 수 있습니다."
peak_cpu = "CPU 최고 {v}"
ram = "메모리"
seconds = "{n}초"

[news]
title = "Windows Stats {version}의 새로운 기능"
body = "이제 경고에 원인이 된 프로그램 이름이 표시됩니다. 직접 켜기 전까지 꺼져 있는 새 경고: 마이크나 카메라를 오래 사용하는 경우, 메모리 사용량이 계속 늘어나는 프로그램, 거의 가득 찬 디스크. 클릭하여 설정하세요."
