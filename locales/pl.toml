title = "Nowości w Windows Stats {version}"
body = "Ostrzeżenia wskazują teraz program, który je wywołał. Nowe ostrzeżenia, wyłączone, dopóki ich nie włączysz: mikrofon lub kamera używane przez długi czas, program, którego pamięć stale rośnie, prawie pełny dysk. Kliknij, aby je skonfigurować."
