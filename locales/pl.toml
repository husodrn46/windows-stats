now = "Teraz działa: {name}"
none_yet = "Brak sesji. Uruchom model, a Windows Stats odnotuje go tutaj."
none_off = "Śledzenie jest wyłączone."
none_unasked = "Jeszcze nie zapytano: Windows Stats zapyta, gdy po raz pierwszy uruchomi się lokalny model."
clear = "Usuń zapisane sesje"
mcp = "Połączenie dla aplikacji AI (MCP)"
mcp_desc = "Aplikacje AI obsługujące MCP (LM Studio, Claude Desktop, VS Code i inne) mogą odczytywać z Windows Stats obciążenie tego komputera i te sesje, tylko do odczytu. Skopiuj konfigurację i wklej ją do ustawień MCP aplikacji (mcpServers); aplikacja uruchamia Windows Stats z --mcp, gdy go potrzebuje, i nie jest otwierany żaden port sieciowy. Nazwy programów pochodzą wyłącznie z narzędzia top_processes; przy modelu w chmurze są wysyłane do tej usługi."
mcp_copy = "Kopiuj konfigurację MCP"
mcp_copied = "Skopiowano konfigurację MCP. Wklej ją do ustawień MCP swojej aplikacji AI."
mcp_copy_failed = "Nie udało się użyć schowka."
started_title = "{name} działa"
started_body = "Windows Stats śledzi tę sesję i pokaże podsumowanie po jej zakończeniu."
ended_title = "{name}: sesja zakończona"
ask = "Działa lokalny model AI ({runtime}).\n\nCzy Windows Stats ma śledzić takie sesje i zapisywać najwyższe wartości procesora, karty graficznej, pamięci wideo, pamięci i temperatur, gdy działa model? Sesje są przechowywane tylko na tym komputerze. Aby pokazać nazwę modelu, Windows Stats pyta program pod jego własnym adresem lokalnym (127.0.0.1); nic nie opuszcza komputera.\n\nMożesz to zmienić w obszarze Ustawienia > AI."
