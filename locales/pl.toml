[ai]
desc = "Gdy działa lokalny model AI (Ollama, llama.cpp, KoboldCpp, LocalAI), Windows Stats to zauważa i zapisuje, jak bardzo komputer jest w tym czasie obciążony: najwyższe wartości procesora, karty graficznej, pamięci wideo, pamięci i temperatur. Sesje są przechowywane tylko na tym komputerze; nazwa modelu jest pobierana z lokalnego adresu samego programu (127.0.0.1)."
watch = "Śledź lokalne sesje AI"
watch_desc = "Co kilka sekund przegląda listę uruchomionych programów, aby zauważyć model. Kolejne programy można dodać w config.toml (ai_processes)."
