clear = "Xóa các phiên đã lưu"
mcp = "Kết nối cho ứng dụng AI (MCP)"
mcp_desc = "Các ứng dụng AI hỗ trợ MCP (LM Studio, Claude Desktop, VS Code và các ứng dụng khác) có thể đọc mức tải của máy tính này và các phiên này từ Windows Stats, ở chế độ chỉ đọc. Hãy sao chép thiết lập và dán vào phần cài đặt MCP của ứng dụng (mcpServers); ứng dụng sẽ khởi động Windows Stats với --mcp khi cần và không có cổng mạng nào được mở. Tên chương trình chỉ đến từ công cụ top_processes; nếu dùng mô hình đám mây, chúng sẽ được gửi đến dịch vụ đó."
mcp_copy = "Sao chép thiết lập MCP"
mcp_copied = "Đã sao chép thiết lập MCP. Hãy dán vào phần cài đặt MCP của ứng dụng AI."
mcp_copy_failed = "Không thể sử dụng bảng tạm."
started_title = "{name} đang chạy"
started_body = "Windows Stats theo dõi phiên này và hiển thị bản tóm tắt khi phiên kết thúc."
ended_title = "{name} đã kết thúc"
ask = "Một mô hình AI cục bộ đang chạy ({runtime}).\n\nWindows Stats có nên theo dõi các phiên như thế này và ghi lại mức cao nhất của CPU, GPU, bộ nhớ video, bộ nhớ và nhiệt độ khi mô hình chạy không? Các phiên chỉ được lưu trên máy tính này. Để hiển thị tên mô hình, Windows Stats hỏi chương trình tại địa chỉ cục bộ của chính nó (127.0.0.1); không có gì rời khỏi máy tính.\n\nBạn có thể thay đổi điều này trong Cài đặt > AI."
peak_cpu = "CPU tối đa {v}"
ram = "Bộ nhớ"
seconds = "{n} giây"

[news]
title = "Có gì mới trong Windows Stats {version}"
body = "Cảnh báo giờ đây nêu tên chương trình gây ra cảnh báo. Các cảnh báo mới, tắt cho đến khi bạn bật: micrô hoặc máy ảnh được dùng trong thời gian dài, chương trình có bộ nhớ liên tục tăng, ổ đĩa gần đầy. Bấm để thiết lập."
