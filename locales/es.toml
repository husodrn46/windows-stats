[ai]
desc = "Cuando se ejecuta un modelo de IA local (Ollama, llama.cpp, KoboldCpp, LocalAI), Windows Stats lo detecta y anota cuánto trabaja el equipo mientras tanto: los máximos de procesador, tarjeta gráfica, memoria de vídeo, memoria y temperaturas. Las sesiones se guardan solo en este equipo; el nombre del modelo se consulta en la propia dirección local del programa (127.0.0.1)."
watch = "Seguir las sesiones de IA locales"
watch_desc = "Revisa la lista de programas en ejecución cada pocos segundos para detectar un modelo. Se pueden agregar más programas en config.toml (ai_processes)."
sessions = "Sesiones recientes"
now = "En ejecución: {name}"
none_yet = "Aún no hay sesiones. Ejecuta un modelo y Windows Stats lo anotará aquí."
none_off = "El seguimiento está desactivado."
none_unasked = "Aún no se ha preguntado: Windows Stats pregunta la primera vez que se ejecuta un modelo local."
clear = "Eliminar las sesiones guardadas"
mcp = "Conexión para aplicaciones de IA (MCP)"
mcp_desc = "Las aplicaciones de IA compatibles con MCP (LM Studio, Claude Desktop, VS Code y otras) pueden leer la carga de este equipo y estas sesiones desde Windows Stats, en modo de solo lectura. Copia la configuración y pégala en la configuración MCP de la aplicación (mcpServers); la aplicación inicia Windows Stats con --mcp cuando lo necesita y no se abre ningún puerto de red. Los nombres de los programas solo proceden de la herramienta top_processes; con un modelo en la nube, se envían a ese servicio."
mcp_copy = "Copiar la configuración MCP"
mcp_copied = "Configuración MCP copiada. Pégala en la configuración MCP de tu aplicación de IA."
mcp_copy_failed = "No se pudo usar el portapapeles."
started_title = "{name} se está ejecutando"
started_body = "Windows Stats sigue esta sesión y muestra un resumen cuando termina."
ended_title = "{name} ha terminado"
ask = "Se está ejecutando un modelo de IA local ({runtime}).\n\n¿Quieres que Windows Stats siga sesiones como esta y anote los máximos de procesador, tarjeta gráfica, memoria de vídeo, memoria y temperaturas mientras se ejecuta un modelo? Las sesiones se guardan solo en este equipo. Para mostrar el nombre del modelo, Windows Stats consulta al programa en su propia dirección local (127.0.0.1); nada sale del equipo.\n\nPuedes cambiarlo en Configuración > IA."
peak_cpu = "Procesador hasta {v}"
ram = "Memoria"
seconds = "{n} s"

[news]
title = "Novedades de Windows Stats {version}"
body = "Los avisos ahora indican el programa que los provoca. Nuevos avisos, desactivados hasta que los actives: micrófono o cámara en uso durante mucho tiempo, un programa cuya memoria no deja de crecer y un disco casi lleno. Haz clic para configurarlos."
