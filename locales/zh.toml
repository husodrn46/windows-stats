[ai]
desc = "当本地 AI 模型（Ollama、llama.cpp、KoboldCpp、LocalAI）运行时，Windows Stats 会检测到它，并记录这段时间电脑的负荷情况：处理器、显卡、显存、内存的最高值以及最高温度。会话仅保存在这台电脑上；模型名称是向该程序自己的本地地址（127.0.0.1）查询获得的。"
watch = "跟踪本地 AI 会话"
watch_desc = "每隔几秒查看一次正在运行的程序列表，以检测模型。可在 config.toml（ai_processes）中添加更多程序。"
sessions = "最近的会话"
now = "正在运行：{name}"
none_yet = "还没有会话。运行模型后，Windows Stats 会在此处记录。"
none_off = "跟踪已关闭。"
none_unasked = "尚未询问：本地模型首次运行时，Windows Stats 会询问你。"
clear = "删除已保存的会话"
mcp = "AI 应用连接（MCP）"
mcp_desc = "支持 MCP 的 AI 应用（LM Studio、Claude Desktop、VS Code 等）可以从 Windows Stats 以只读方式读取这台电脑的负载和这些会话。复制配置并将其粘贴到应用的 MCP 设置（mcpServers）中；应用会在需要时使用 --mcp 启动 Windows Stats，不会打开任何网络端口。程序名称仅来自 top_processes 工具；如果使用云端模型，这些名称会被发送到该服务。"
