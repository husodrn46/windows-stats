ask = "有本地 AI 模型正在运行（{runtime}）。\n\n要让 Windows Stats 跟踪此类会话，并在模型运行期间记录处理器、显卡、显存、内存的最高值以及最高温度吗？会话仅保存在这台电脑上。为了显示模型名称，Windows Stats 会向该程序自己的本地地址（127.0.0.1）查询；任何数据都不会离开这台电脑。\n\n你可以在“设置 > AI”中更改此选项。"
