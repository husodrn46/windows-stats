[ai]
desc = "Quando è in esecuzione un modello di IA locale (Ollama, llama.cpp, KoboldCpp, LocalAI), Windows Stats lo rileva e annota quanto lavora il computer nel frattempo: i picchi di processore, scheda grafica, memoria video, memoria e temperature. Le sessioni vengono conservate solo su questo computer; il nome del modello viene chiesto all'indirizzo locale del programma stesso (127.0.0.1)."
watch = "Monitora le sessioni di IA locali"
watch_desc = "Controlla l'elenco dei programmi in esecuzione ogni pochi secondi per rilevare un modello. Altri programmi possono essere aggiunti in config.toml (ai_processes)."
sessions = "Sessioni recenti"
now = "In esecuzione: {name}"
none_yet = "Ancora nessuna sessione. Esegui un modello e Windows Stats lo annoterà qui."
none_off = "Il monitoraggio è disattivato."
none_unasked = "Non ancora richiesto: Windows Stats lo chiede la prima volta che viene eseguito un modello locale."
clear = "Elimina le sessioni salvate"
mcp = "Connessione per app di IA (MCP)"
mcp_desc = "Le app di IA che supportano MCP (LM Studio, Claude Desktop, VS Code e altre) possono leggere il carico di questo computer e queste sessioni da Windows Stats, in sola lettura. Copia la configurazione e incollala nelle impostazioni MCP dell'app (mcpServers); l'app avvia Windows Stats con --mcp quando ne ha bisogno e non viene aperta alcuna porta di rete. I nomi dei programmi provengono solo dallo strumento top_processes; con un modello cloud vengono inviati a quel servizio."
mcp_copy = "Copia la configurazione MCP"
mcp_copied = "Configurazione MCP copiata. Incollala nelle impostazioni MCP della tua app di IA."
mcp_copy_failed = "Impossibile usare gli Appunti."
started_title = "{name} è in esecuzione"
started_body = "Windows Stats monitora questa sessione e mostra un riepilogo al termine."
ended_title = "{name} terminato"
ask = "È in esecuzione un modello di IA locale ({runtime}).\n\nVuoi che Windows Stats monitori sessioni come questa e annoti i picchi di processore, scheda grafica, memoria video, memoria e temperature mentre un modello è in esecuzione? Le sessioni vengono conservate solo su questo computer. Per mostrare il nome del modello, Windows Stats lo chiede al programma al suo indirizzo locale (127.0.0.1); nulla lascia il computer.\n\nPuoi cambiare questa scelta in Impostazioni > IA."
peak_cpu = "Processore fino a {v}"
ram = "Memoria"
seconds = "{n} s"

[news]
title = "Novità di Windows Stats {version}"
body = "Gli avvisi ora indicano il programma che li causa. Nuovi avvisi, disattivati finché non li attivi: microfono o fotocamera in uso a lungo, un programma la cui memoria continua a crescere, un disco quasi pieno. Fai clic per configurarli."
