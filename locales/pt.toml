[ai]
desc = "Quando um modelo de IA local está em execução (Ollama, llama.cpp, KoboldCpp, LocalAI), o Windows Stats deteta-o e regista o esforço do computador entretanto: os máximos de processador, placa gráfica, memória de vídeo, memória e temperaturas. As sessões são guardadas apenas neste computador; o nome do modelo é pedido ao próprio endereço local do programa (127.0.0.1)."
watch = "Acompanhar sessões de IA locais"
watch_desc = "Consulta a lista de programas em execução a cada poucos segundos para detetar um modelo. Pode adicionar mais programas em config.toml (ai_processes)."
sessions = "Sessões recentes"
now = "Em execução: {name}"
none_yet = "Ainda não há sessões. Execute um modelo e o Windows Stats regista-o aqui."
none_off = "O acompanhamento está desativado."
none_unasked = "Ainda não perguntado: o Windows Stats pergunta da primeira vez que um modelo local é executado."
clear = "Eliminar as sessões guardadas"
mcp = "Ligação para aplicações de IA (MCP)"
mcp_desc = "As aplicações de IA compatíveis com MCP (LM Studio, Claude Desktop, VS Code e outras) podem ler a carga deste computador e estas sessões a partir do Windows Stats, apenas em modo de leitura. Copie a configuração e cole-a nas definições MCP da aplicação (mcpServers); a aplicação inicia o Windows Stats com --mcp quando precisa e não é aberta nenhuma porta de rede. Os nomes dos programas vêm apenas da ferramenta top_processes; com um modelo na nuvem, são enviados para esse serviço."
mcp_copy = "Copiar a configuração MCP"
mcp_copied = "Configuração MCP copiada. Cole-a nas definições MCP da sua aplicação de IA."
mcp_copy_failed = "Não foi possível utilizar a área de transferência."
started_title = "{name} está em execução"
started_body = "O Windows Stats acompanha esta sessão e mostra um resumo quando terminar."
ended_title = "{name} terminou"
ask = "Está em execução um modelo de IA local ({runtime}).\n\nO Windows Stats deve acompanhar sessões como esta e registar os máximos de processador, placa gráfica, memória de vídeo, memória e temperaturas enquanto um modelo é executado? As sessões são guardadas apenas neste computador. Para mostrar o nome do modelo, o Windows Stats pergunta ao programa no seu próprio endereço local (127.0.0.1); nada sai do computador.\n\nPode alterar isto em Definições > IA."
peak_cpu = "Processador até {v}"
ram = "Memória"
seconds = "{n} s"

[news]
title = "Novidades do Windows Stats {version}"
body = "Os avisos indicam agora o programa que os causa. Novos avisos, desativados até os ativar: microfone ou câmara em utilização durante muito tempo, um programa cuja memória não para de crescer e um disco quase cheio. Clique para os configurar."
