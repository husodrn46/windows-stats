[news]
title = "Ново в Windows Stats {version}"
body = "Предупрежденията вече посочват програмата, която ги е предизвикала. Нови предупреждения, изключени, докато не ги включите: микрофон или камера, използвани твърде дълго, програма, чиято памет постоянно расте, почти пълен диск. Щракнете, за да ги настроите."
