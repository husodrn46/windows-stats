[ai]
desc = "Als er een lokaal AI-model draait (Ollama, llama.cpp, KoboldCpp, LocalAI), merkt Windows Stats dat op en houdt het bij hoe hard de computer intussen werkt: de hoogste waarden voor processor, grafische kaart, videogeheugen, geheugen en temperaturen. Sessies worden alleen op deze computer bewaard; de naam van het model wordt opgevraagd via het eigen lokale adres van het programma (127.0.0.1)."
watch = "Lokale AI-sessies volgen"
watch_desc = "Kijkt om de paar seconden in de lijst met actieve programma's om een model op te merken. Meer programma's kun je toevoegen in config.toml (ai_processes)."
sessions = "Recente sessies"
now = "Draait nu: {name}"
none_yet = "Nog geen sessies. Start een model en Windows Stats houdt het hier bij."
none_off = "Volgen staat uit."
none_unasked = "Nog niet gevraagd: Windows Stats vraagt het de eerste keer dat er een lokaal model draait."
clear = "Opgeslagen sessies verwijderen"
mcp = "Verbinding voor AI-apps (MCP)"
mcp_desc = "AI-apps die MCP ondersteunen (LM Studio, Claude Desktop, VS Code en andere) kunnen de belasting van deze computer en deze sessies alleen-lezen uit Windows Stats ophalen. Kopieer de configuratie en plak die in de MCP-instellingen van de app (mcpServers); de app start Windows Stats met --mcp wanneer dat nodig is en er wordt geen netwerkpoort geopend. Programmanamen komen alleen uit het hulpmiddel top_processes; bij een cloudmodel worden ze naar die dienst gestuurd."
mcp_copy = "MCP-configuratie kopiëren"
mcp_copied = "MCP-configuratie gekopieerd. Plak die in de MCP-instellingen van je AI-app."
mcp_copy_failed = "Het klembord kon niet worden gebruikt."
started_title = "{name} draait"
started_body = "Windows Stats volgt deze sessie en toont een samenvatting als die afloopt."
ended_title = "{name} is gestopt"
ask = "Er draait een lokaal AI-model ({runtime}).\n\nMoet Windows Stats sessies zoals deze volgen en de hoogste waarden voor processor, grafische kaart, videogeheugen, geheugen en temperaturen bijhouden terwijl een model draait? Sessies worden alleen op deze computer bewaard. Om de naam van het model te tonen, vraagt Windows Stats het programma op zijn eigen lokale adres (127.0.0.1); er verlaat niets de computer.\n\nJe kunt dit wijzigen via Instellingen > AI."
