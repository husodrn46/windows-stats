[ai]
desc = "Når en lokal AI-model kører (Ollama, llama.cpp, KoboldCpp, LocalAI), opdager Windows Stats det og noterer, hvor hårdt computeren arbejder imens: de højeste værdier for processor, grafikkort, grafikhukommelse, hukommelse og temperaturer. Sessioner gemmes kun på denne computer; modellens navn hentes fra programmets egen lokale adresse (127.0.0.1)."
watch = "Følg lokale AI-sessioner"
watch_desc = "Kigger med få sekunders mellemrum på listen over kørende programmer for at opdage en model. Flere programmer kan tilføjes i config.toml (ai_processes)."
sessions = "Seneste sessioner"
now = "Kører nu: {name}"
none_yet = "Ingen sessioner endnu. Kør en model, så noterer Windows Stats den her."
none_off = "Sporing er slået fra."
none_unasked = "Ikke spurgt endnu: Windows Stats spørger, første gang en lokal model kører."
clear = "Slet de gemte sessioner"
mcp = "Forbindelse til AI-apps (MCP)"
mcp_desc = "AI-apps, der understøtter MCP (LM Studio, Claude Desktop, VS Code og andre), kan læse denne computers belastning og disse sessioner fra Windows Stats, skrivebeskyttet. Kopiér opsætningen, og indsæt den i appens MCP-indstillinger (mcpServers); appen starter Windows Stats med --mcp, når den har brug for det, og der åbnes ingen netværksport. Programnavne kommer kun fra værktøjet top_processes; med en cloudmodel sendes de til den tjeneste."
mcp_copy = "Kopiér MCP-opsætningen"
mcp_copied = "MCP-opsætningen er kopieret. Indsæt den i MCP-indstillingerne i din AI-app."
mcp_copy_failed = "Udklipsholderen kunne ikke bruges."
started_title = "{name} kører"
started_body = "Windows Stats følger denne session og viser en oversigt, når den slutter."
ended_title = "{name} er færdig"
ask = "En lokal AI-model kører ({runtime}).\n\nSkal Windows Stats følge sessioner som denne og notere de højeste værdier for processor, grafikkort, grafikhukommelse, hukommelse og temperaturer, mens en model kører? Sessioner gemmes kun på denne computer. For at vise modellens navn spørger Windows Stats programmet på dets egen lokale adresse (127.0.0.1); intet forlader computeren.\n\nDu kan ændre dette under Indstillinger > AI."
peak_cpu = "Processor op til {v}"
ram = "Hukommelse"
seconds = "{n} s"

[news]
title = "Nyt i Windows Stats {version}"
body = "Advarsler nævner nu programmet bag dem. Nye advarsler, der er slået fra, indtil du slår dem til: mikrofon eller kamera i brug længe, et program, hvis hukommelse bliver ved med at vokse, en disk, der næsten er fuld. Klik for at indstille dem."
