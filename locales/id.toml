started_body = "Windows Stats memantau sesi ini dan menampilkan ringkasan saat sesi berakhir."
ended_title = "{name} selesai"
ask = "Model AI lokal sedang berjalan ({runtime}).\n\nIzinkan Windows Stats memantau sesi seperti ini dan mencatat CPU, GPU, memori video, memori, dan suhu tertinggi selama model berjalan? Sesi hanya disimpan di komputer ini. Untuk menampilkan nama model, Windows Stats bertanya ke program tersebut di alamat lokalnya sendiri (127.0.0.1); tidak ada yang keluar dari komputer.\n\nAnda dapat mengubahnya di Pengaturan > AI."
