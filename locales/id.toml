[news]
title = "Yang baru di Windows Stats {version}"
body = "Peringatan kini menyebutkan program penyebabnya. Peringatan baru, nonaktif sampai Anda mengaktifkannya: mikrofon atau kamera yang lama digunakan, program yang memorinya terus bertambah, disk yang hampir penuh. Klik untuk mengaturnya."
