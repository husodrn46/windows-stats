[ai]
desc = "Saat model AI lokal berjalan (Ollama, llama.cpp, KoboldCpp, LocalAI), Windows Stats mendeteksinya dan mencatat seberapa keras komputer bekerja selama itu: CPU, GPU, memori video, memori, dan suhu tertinggi. Sesi hanya disimpan di komputer ini; nama model ditanyakan ke alamat lokal program itu sendiri (127.0.0.1)."
watch = "Pantau sesi AI lokal"
watch_desc = "Memeriksa daftar program yang berjalan setiap beberapa detik untuk mendeteksi model. Program lain dapat ditambahkan di config.toml (ai_processes)."
sessions = "Sesi terbaru"
now = "Sedang berjalan: {name}"
none_yet = "Belum ada sesi. Jalankan model dan Windows Stats akan mencatatnya di sini."
none_off = "Pemantauan nonaktif."
none_unasked = "Belum ditanyakan: Windows Stats akan bertanya saat model lokal pertama kali berjalan."
clear = "Hapus sesi yang tersimpan"
mcp = "Koneksi untuk aplikasi AI (MCP)"
mcp_desc = "Aplikasi AI yang mendukung MCP (LM Studio, Claude Desktop, VS Code, dan lainnya) dapat membaca beban komputer ini dan sesi-sesi ini dari Windows Stats, hanya-baca. Salin pengaturannya dan tempelkan ke pengaturan MCP aplikasi (mcpServers); aplikasi akan memulai Windows Stats dengan --mcp saat diperlukan dan tidak ada port jaringan yang dibuka. Nama program hanya berasal dari alat top_processes; jika menggunakan model cloud, nama tersebut dikirim ke layanan itu."
mcp_copy = "Salin pengaturan MCP"
mcp_copied = "Pengaturan MCP disalin. Tempelkan ke pengaturan MCP aplikasi AI Anda."
mcp_copy_failed = "Papan klip tidak dapat digunakan."
