[ai]
desc = "Când rulează un model de IA local (Ollama, llama.cpp, KoboldCpp, LocalAI), Windows Stats îl observă și notează cât de mult lucrează computerul între timp: valorile maxime pentru procesor, placa video, memoria video, memorie și temperaturi. Sesiunile sunt păstrate doar pe acest computer; numele modelului este cerut de la adresa locală proprie a programului (127.0.0.1)."
watch = "Urmărește sesiunile de IA locale"
watch_desc = "Verifică lista programelor care rulează la câteva secunde pentru a observa un model. Se pot adăuga mai multe programe în config.toml (ai_processes)."
sessions = "Sesiuni recente"
now = "Rulează acum: {name}"
none_yet = "Nicio sesiune încă. Rulează un model și Windows Stats îl va nota aici."
none_off = "Urmărirea este dezactivată."
none_unasked = "Încă nu s-a întrebat: Windows Stats întreabă prima dată când rulează un model local."
clear = "Șterge sesiunile salvate"
mcp = "Conexiune pentru aplicațiile de IA (MCP)"
mcp_desc = "Aplicațiile de IA care acceptă MCP (LM Studio, Claude Desktop, VS Code și altele) pot citi din Windows Stats încărcarea acestui computer și aceste sesiuni, doar în citire. Copiază configurarea și lipește-o în setările MCP ale aplicației (mcpServers); aplicația pornește Windows Stats cu --mcp când are nevoie și nu se deschide niciun port de rețea. Numele programelor provin doar din instrumentul top_processes; cu un model în cloud, ele sunt trimise acelui serviciu."
mcp_copy = "Copiază configurarea MCP"
mcp_copied = "Configurarea MCP a fost copiată. Lipește-o în setările MCP ale aplicației tale de IA."
mcp_copy_failed = "Clipboardul nu a putut fi folosit."
started_title = "{name} rulează"
started_body = "Windows Stats urmărește această sesiune și afișează un rezumat când se termină."
ended_title = "{name} s-a încheiat"
ask = "Rulează un model de IA local ({runtime}).\n\nVrei ca Windows Stats să urmărească astfel de sesiuni și să noteze valorile maxime pentru procesor, placa video, memoria video, memorie și temperaturi cât timp rulează un model? Sesiunile sunt păstrate doar pe acest computer. Pentru a afișa numele modelului, Windows Stats întreabă programul la propria lui adresă locală (127.0.0.1); nimic nu părăsește computerul.\n\nPoți schimba acest lucru în Setări > IA."
