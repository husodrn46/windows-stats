title = "Noutăți în Windows Stats {version}"
body = "Avertismentele numesc acum programul care le provoacă. Avertismente noi, dezactivate până le activezi: microfonul sau camera în uz mult timp, un program a cărui memorie tot crește, un disc aproape plin. Fă clic pentru a le configura."
