now = "Körs nu: {name}"
none_yet = "Inga sessioner än. Kör en modell så noterar Windows Stats den här."
none_off = "Uppföljningen är avstängd."
none_unasked = "Inte tillfrågat än: Windows Stats frågar första gången en lokal modell körs."
clear = "Ta bort de sparade sessionerna"
mcp = "Anslutning för AI-appar (MCP)"
mcp_desc = "AI-appar som stöder MCP (LM Studio, Claude Desktop, VS Code med flera) kan läsa den här datorns belastning och de här sessionerna från Windows Stats, skrivskyddat. Kopiera konfigurationen och klistra in den i appens MCP-inställningar (mcpServers); appen startar Windows Stats med --mcp när den behöver det, och ingen nätverksport öppnas. Programnamn kommer bara från verktyget top_processes; med en molnmodell skickas de till den tjänsten."
mcp_copy = "Kopiera MCP-konfigurationen"
mcp_copied = "MCP-konfigurationen har kopierats. Klistra in den i AI-appens MCP-inställningar."
