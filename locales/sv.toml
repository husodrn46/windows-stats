[ai]
desc = "När en lokal AI-modell körs (Ollama, llama.cpp, KoboldCpp, LocalAI) märker Windows Stats det och noterar hur hårt datorn arbetar under tiden: de högsta värdena för processor, grafikkort, grafikminne, minne och temperaturer. Sessioner sparas bara på den här datorn; modellens namn hämtas från programmets egen lokala adress (127.0.0.1)."
watch = "Följ lokala AI-sessioner"
watch_desc = "Tittar med några sekunders mellanrum i listan över program som körs för att upptäcka en modell. Fler program kan läggas till i config.toml (ai_processes)."
