ended_title = "{name} är klar"
ask = "En lokal AI-modell körs ({runtime}).\n\nSka Windows Stats följa sådana sessioner och notera de högsta värdena för processor, grafikkort, grafikminne, minne och temperaturer medan en modell körs? Sessioner sparas bara på den här datorn. För att visa modellens namn frågar Windows Stats programmet på dess egen lokala adress (127.0.0.1); ingenting lämnar datorn.\n\nDu kan ändra detta under Inställningar > AI."
