pawnio_yes = "Ο οδηγός PawnIO είναι εγκατεστημένος"
pawnio_no = "Ο οδηγός PawnIO δεν είναι εγκατεστημένος"
pawnio_long = "Οι θερμοκρασίες επεξεργαστή, η ισχύς, οι ταχύτητες των ανεμιστήρων και οι τάσεις της μητρικής πλακέτας απαιτούν τον οδηγό πυρήνα PawnIO και ένα βοηθητικό πρόγραμμα με αυξημένα δικαιώματα. Αυτή η ανυπόγραφη έκδοση δεν μπορεί να δώσει με ασφάλεια αυξημένα δικαιώματα στο βοηθητικό της πρόγραμμα, στο οποίο μπορεί να γράψει ο χρήστης, οπότε αυτές οι μετρήσεις παραμένουν μη διαθέσιμες ακόμη κι αν το PawnIO είναι εγκατεστημένο. Το Windows Stats δεν εγκαθιστά ποτέ οδηγούς."
