lhm_admin_disabled = "Ασφάλεια: το ανυπόγραφο βοηθητικό πρόγραμμα εκτελείται μόνο με τα δικαιώματα του χρήστη σας. Η λειτουργία διαχειριστή είναι απενεργοποιημένη στις εγκαταστάσεις ανά χρήστη. Οι θερμοκρασίες επεξεργαστή και άλλοι αισθητήρες που διαβάζονται μόνο μέσω PawnIO ενδέχεται να μην είναι διαθέσιμοι."
page_sensors = "Αισθητήρες"
sensors_desc = "Οι θερμοκρασίες των δίσκων και, σε αποκλειστικές κάρτες γραφικών, η θερμοκρασία της κάρτας γραφικών προέρχονται από τα ίδια τα Windows. Περισσότεροι αισθητήρες είναι διαθέσιμοι μέσω του LibreHardwareMonitor, που εκτελείται ως ξεχωριστή βοηθητική διεργασία."
lhm = "Προηγμένοι αισθητήρες (LibreHardwareMonitor)"
lhm_desc = "Εκτελεί το WindowsStats.Sensors.exe με τον δικό σας χρήστη, χωρίς δικαιώματα διαχειριστή. Δεν εγκαθιστά τίποτα και επικοινωνεί με το Windows Stats μόνο μέσω ενός καναλιού (pipe)."
