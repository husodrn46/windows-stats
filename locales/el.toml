auto = "Έλεγχος για νέες εκδόσεις"
auto_desc = "Το πολύ μία φορά την ημέρα ρωτά το GitHub για τον αριθμό της τελευταίας έκδοσης και σας ενημερώνει όταν κυκλοφορήσει νέα έκδοση. Το GitHub βλέπει μόνο το ίδιο το αίτημα (τη διεύθυνση IP σας και την έκδοση του Windows Stats). Δεν αποστέλλονται ρυθμίσεις, μετρήσεις ή αναγνωριστικά."
ask = "Να ελέγχει το Windows Stats για νέες εκδόσεις;\n\nΤο πολύ μία φορά την ημέρα ρωτά το GitHub για τον αριθμό της τελευταίας έκδοσης και σας ενημερώνει όταν υπάρχει διαθέσιμη νέα έκδοση. Στη συνέχεια μπορείτε να κάνετε την ενημέρωση από τις Ρυθμίσεις > Πληροφορίες. Το GitHub βλέπει μόνο το ίδιο το αίτημα (τη διεύθυνση IP σας και την έκδοση του Windows Stats). Δεν αποστέλλονται ρυθμίσεις, μετρήσεις ή αναγνωριστικά.\n\nΜπορείτε να το αλλάξετε οποιαδήποτε στιγμή στις Ρυθμίσεις > Απόρρητο."
toast_title = "Το Windows Stats {version} είναι διαθέσιμο"
toast_body = "Κάντε κλικ για να ανοίξετε τις Ρυθμίσεις > Πληροφορίες και να κάνετε την ενημέρωση."

[ai]
desc = "Όταν εκτελείται ένα τοπικό μοντέλο τεχνητής νοημοσύνης (Ollama, llama.cpp, KoboldCpp, LocalAI), το Windows Stats το αντιλαμβάνεται και καταγράφει πόσο επιβαρύνεται ο υπολογιστής στο μεταξύ: τη μέγιστη χρήση επεξεργαστή, κάρτας γραφικών, μνήμης γραφικών και μνήμης, καθώς και τις μέγιστες θερμοκρασίες. Οι συνεδρίες φυλάσσονται μόνο σε αυτόν τον υπολογιστή. Το όνομα του μοντέλου ζητείται από την τοπική διεύθυνση του ίδιου του προγράμματος (127.0.0.1)."
watch = "Παρακολούθηση τοπικών συνεδριών τεχνητής νοημοσύνης"
watch_desc = "Ελέγχει κάθε λίγα δευτερόλεπτα τη λίστα των προγραμμάτων που εκτελούνται, για να εντοπίσει ένα μοντέλο. Μπορείτε να προσθέσετε περισσότερα προγράμματα στο config.toml (ai_processes)."
sessions = "Πρόσφατες συνεδρίες"
now = "Εκτελείται τώρα: {name}"
none_yet = "Δεν υπάρχουν ακόμη συνεδρίες. Εκτελέστε ένα μοντέλο και το Windows Stats θα το καταγράψει εδώ."
none_off = "Η παρακολούθηση είναι απενεργοποιημένη."
none_unasked = "Δεν έχετε ερωτηθεί ακόμη: το Windows Stats θα σας ρωτήσει την πρώτη φορά που θα εκτελεστεί ένα τοπικό μοντέλο."
clear = "Διαγραφή των αποθηκευμένων συνεδριών"
mcp = "Σύνδεση για εφαρμογές τεχνητής νοημοσύνης (MCP)"
mcp_desc = "Οι εφαρμογές τεχνητής νοημοσύνης που υποστηρίζουν MCP (LM Studio, Claude Desktop, VS Code και άλλες) μπορούν να διαβάζουν από το Windows Stats τον φόρτο αυτού του υπολογιστή και αυτές τις συνεδρίες, μόνο για ανάγνωση. Αντιγράψτε τη ρύθμιση και επικολλήστε την στις ρυθμίσεις MCP της εφαρμογής (mcpServers). Η εφαρμογή ξεκινά το Windows Stats με --mcp όταν το χρειάζεται και δεν ανοίγει καμία θύρα δικτύου. Τα ονόματα προγραμμάτων προέρχονται μόνο από το εργαλείο top_processes. Με ένα μοντέλο στο cloud, αποστέλλονται σε εκείνη την υπηρεσία."
mcp_copy = "Αντιγραφή της ρύθμισης MCP"
mcp_copied = "Η ρύθμιση MCP αντιγράφηκε. Επικολλήστε την στις ρυθμίσεις MCP της εφαρμογής τεχνητής νοημοσύνης σας."
mcp_copy_failed = "Δεν ήταν δυνατή η χρήση του Προχείρου."
started_title = "Εκτελείται: {name}"
started_body = "Το Windows Stats παρακολουθεί αυτή τη συνεδρία και θα εμφανίσει μια σύνοψη όταν τελειώσει."
ended_title = "Ολοκληρώθηκε: {name}"
ask = "Εκτελείται ένα τοπικό μοντέλο τεχνητής νοημοσύνης ({runtime}).\n\nΝα παρακολουθεί το Windows Stats τέτοιες συνεδρίες και να καταγράφει τη μέγιστη χρήση επεξεργαστή, κάρτας γραφικών, μνήμης γραφικών και μνήμης, καθώς και τις μέγιστες θερμοκρασίες, όσο εκτελείται ένα μοντέλο; Οι συνεδρίες φυλάσσονται μόνο σε αυτόν τον υπολογιστή. Για να εμφανίσει το όνομα του μοντέλου, το Windows Stats ρωτά το πρόγραμμα στη δική του τοπική διεύθυνση (127.0.0.1). Τίποτα δεν φεύγει από τον υπολογιστή.\n\nΜπορείτε να το αλλάξετε στις Ρυθμίσεις > Τεχνητή νοημοσύνη."
peak_cpu = "CPU έως {v}"
ram = "RAM"
seconds = "{n} δευτ."

[news]
title = "Τι νέο υπάρχει στο Windows Stats {version}"
body = "Οι προειδοποιήσεις αναφέρουν πλέον το πρόγραμμα που τις προκαλεί. Νέες προειδοποιήσεις, ανενεργές μέχρι να τις ενεργοποιήσετε: μικρόφωνο ή κάμερα σε χρήση για πολλή ώρα, πρόγραμμα του οποίου η μνήμη αυξάνεται συνεχώς, δίσκος σχεδόν γεμάτος. Κάντε κλικ για να τις ρυθμίσετε."
