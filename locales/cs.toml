[ai]
desc = "Když běží místní model AI (Ollama, llama.cpp, KoboldCpp, LocalAI), Windows Stats si toho všimne a zaznamená, jak moc je počítač mezitím vytížený: nejvyšší hodnoty procesoru, grafiky, videopaměti, paměti a teplot. Relace se ukládají jen v tomto počítači; název modelu se zjišťuje z vlastní místní adresy programu (127.0.0.1)."
watch = "Sledovat místní relace AI"
watch_desc = "Každých několik sekund projde seznam spuštěných programů, aby zachytil model. Další programy lze přidat v config.toml (ai_processes)."
sessions = "Nedávné relace"
now = "Právě běží: {name}"
none_yet = "Zatím žádné relace. Spusťte model a Windows Stats ho tu zaznamená."
none_off = "Sledování je vypnuté."
none_unasked = "Dotaz ještě nepadl: Windows Stats se zeptá, až se poprvé spustí místní model."
clear = "Odstranit uložené relace"
mcp = "Připojení pro aplikace AI (MCP)"
mcp_desc = "Aplikace AI s podporou MCP (LM Studio, Claude Desktop, VS Code a další) mohou z Windows Stats číst vytížení tohoto počítače a tyto relace, jen pro čtení. Zkopírujte konfiguraci a vložte ji do nastavení MCP dané aplikace (mcpServers); aplikace spustí Windows Stats s --mcp, když ho potřebuje, a neotevírá se žádný síťový port. Názvy programů poskytuje jen nástroj top_processes; s cloudovým modelem se odesílají do této služby."
mcp_copy = "Zkopírovat konfiguraci MCP"
mcp_copied = "Konfigurace MCP byla zkopírována. Vložte ji do nastavení MCP své aplikace AI."
mcp_copy_failed = "Schránku se nepodařilo použít."
started_title = "{name} běží"
started_body = "Windows Stats tuto relaci sleduje a po jejím skončení zobrazí souhrn."
ended_title = "{name}: relace skončila"
ask = "Běží místní model AI ({runtime}).\n\nMá Windows Stats sledovat takové relace a zaznamenávat nejvyšší hodnoty procesoru, grafiky, videopaměti, paměti a teplot, zatímco model běží? Relace se ukládají jen v tomto počítači. Aby mohl zobrazit název modelu, Windows Stats se ptá programu na jeho vlastní místní adrese (127.0.0.1); nic neopouští počítač.\n\nToto můžete změnit v Nastavení > AI."
