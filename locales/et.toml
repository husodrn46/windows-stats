[ai]
desc = "Kui töötab kohalik tehisintellekti mudel (Ollama, llama.cpp, KoboldCpp, LocalAI), märkab Windows Stats seda ja märgib üles, kui palju arvuti samal ajal töötab: protsessori, graafikakaardi, videomälu ja mälu suurima kasutuse ning kõrgeimad temperatuurid. Seansse hoitakse ainult selles arvutis; mudeli nime küsitakse programmi enda kohalikult aadressilt (127.0.0.1)."
watch = "Jälgi kohalikke tehisintellekti seansse"
watch_desc = "Vaatab iga paari sekundi järel töötavate programmide loendit, et mudelit märgata. Rohkem programme saab lisada failis config.toml (ai_processes)."
sessions = "Hiljutised seansid"
now = "Praegu töötab: {name}"
none_yet = "Seansse veel pole. Käivitage mudel ja Windows Stats märgib selle siia üles."
none_off = "Jälgimine on välja lülitatud."
none_unasked = "Veel pole küsitud: Windows Stats küsib, kui kohalik mudel esimest korda töötab."
clear = "Kustuta salvestatud seansid"
mcp = "Ühendus tehisintellekti rakendustele (MCP)"
mcp_desc = "MCP-d toetavad tehisintellekti rakendused (LM Studio, Claude Desktop, VS Code jt) saavad rakendusest Windows Stats lugeda selle arvuti koormust ja neid seansse, ainult lugemiseks. Kopeerige seadistus ja kleepige see rakenduse MCP-sätetesse (mcpServers); rakendus käivitab vajaduse korral Windows Stats võtmega --mcp ja ühtegi võrguporti ei avata. Programmide nimed tulevad ainult tööriistast top_processes; pilvemudeli korral saadetakse need sellele teenusele."
mcp_copy = "Kopeeri MCP seadistus"
mcp_copied = "MCP seadistus kopeeriti. Kleepige see oma tehisintellekti rakenduse MCP-sätetesse."
mcp_copy_failed = "Lõikelauda ei saanud kasutada."
started_title = "Töötab: {name}"
started_body = "Windows Stats jälgib seda seanssi ja näitab selle lõppedes kokkuvõtet."
ended_title = "Lõppes: {name}"
ask = "Töötab kohalik tehisintellekti mudel ({runtime}).\n\nKas Windows Stats peaks selliseid seansse jälgima ja mudeli töötamise ajal üles märkima protsessori, graafikakaardi, videomälu ja mälu suurima kasutuse ning kõrgeimad temperatuurid? Seansse hoitakse ainult selles arvutis. Mudeli nime kuvamiseks küsib Windows Stats seda programmilt selle enda kohalikul aadressil (127.0.0.1); midagi ei lahku arvutist.\n\nSeda saate muuta jaotises Sätted > Tehisintellekt."
peak_cpu = "CPU kuni {v}"
ram = "RAM"
seconds = "{n} s"

[news]
title = "Mis on uut: Windows Stats {version}"
body = "Hoiatused nimetavad nüüd programmi, mis neid põhjustab. Uued hoiatused, mis on välja lülitatud, kuni need sisse lülitate: kaua kasutusel olev mikrofon või kaamera, programm, mille mälukasutus pidevalt kasvab, ja peaaegu täis ketas. Klõpsake nende seadistamiseks."
