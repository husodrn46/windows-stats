mcp = "Веза за AI апликације (MCP)"
mcp_desc = "AI апликације које подржавају MCP (LM Studio, Claude Desktop, VS Code и друге) могу из програма Windows Stats да читају оптерећење овог рачунара и ове сесије, само за читање. Копирајте конфигурацију и налепите је у MCP подешавања апликације (mcpServers); апликација покреће Windows Stats са --mcp када јој затреба и не отвара се ниједан мрежни порт. Називи програма долазе само из алатке top_processes; са моделом у облаку они се шаљу тој услузи."
