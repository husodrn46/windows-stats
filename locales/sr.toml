[ai]
desc = "Када ради локални AI модел (Ollama, llama.cpp, KoboldCpp, LocalAI), Windows Stats то примећује и бележи колико је рачунар у међувремену оптерећен: највише оптерећење процесора и графичке картице, видео меморију, меморију и температуре. Сесије се чувају само на овом рачунару; назив модела се тражи са сопствене локалне адресе програма (127.0.0.1)."
