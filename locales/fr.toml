[ai]
desc = "Lorsqu'un modèle d'IA local s'exécute (Ollama, llama.cpp, KoboldCpp, LocalAI), Windows Stats le détecte et note l'effort fourni par l'ordinateur pendant ce temps : les pics d'utilisation du processeur, de la carte graphique, de la mémoire vidéo et de la mémoire, ainsi que les températures maximales. Les sessions sont conservées uniquement sur cet ordinateur ; le nom du modèle est demandé à l'adresse locale du programme lui-même (127.0.0.1)."
watch = "Suivre les sessions d'IA locales"
watch_desc = "Consulte la liste des programmes en cours d'exécution toutes les quelques secondes pour repérer un modèle. D'autres programmes peuvent être ajoutés dans config.toml (ai_processes)."
sessions = "Sessions récentes"
now = "En cours : {name}"
none_yet = "Aucune session pour l'instant. Lancez un modèle et Windows Stats le notera ici."
none_off = "Le suivi est désactivé."
none_unasked = "Pas encore demandé : Windows Stats pose la question la première fois qu'un modèle local s'exécute."
clear = "Supprimer les sessions enregistrées"
mcp = "Connexion pour les applications d'IA (MCP)"
mcp_desc = "Les applications d'IA compatibles MCP (LM Studio, Claude Desktop, VS Code et d'autres) peuvent lire la charge de cet ordinateur et ces sessions dans Windows Stats, en lecture seule. Copiez la configuration et collez-la dans les paramètres MCP de l'application (mcpServers) ; l'application lance Windows Stats avec --mcp quand elle en a besoin, et aucun port réseau n'est ouvert. Les noms de programmes proviennent uniquement de l'outil top_processes ; avec un modèle dans le cloud, ils sont envoyés à ce service."
mcp_copy = "Copier la configuration MCP"
mcp_copied = "Configuration MCP copiée. Collez-la dans les paramètres MCP de votre application d'IA."
mcp_copy_failed = "Impossible d'utiliser le Presse-papiers."
started_title = "{name} est en cours d'exécution"
started_body = "Windows Stats suit cette session et affiche un résumé lorsqu'elle se termine."
ended_title = "{name} terminé"
ask = "Un modèle d'IA local est en cours d'exécution ({runtime}).\n\nWindows Stats doit-il suivre ce type de session et noter les pics d'utilisation du processeur, de la carte graphique, de la mémoire vidéo et de la mémoire, ainsi que les températures maximales, pendant l'exécution d'un modèle ? Les sessions sont conservées uniquement sur cet ordinateur. Pour afficher le nom du modèle, Windows Stats interroge le programme à sa propre adresse locale (127.0.0.1) ; rien ne quitte l'ordinateur.\n\nVous pouvez modifier ce choix dans Paramètres > IA."
peak_cpu = "Processeur jusqu'à {v}"
ram = "Mémoire"
seconds = "{n} s"

