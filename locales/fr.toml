title = "Nouveautés de Windows Stats {version}"
body = "Les avertissements indiquent désormais le programme en cause. Nouveaux avertissements, désactivés tant que vous ne les activez pas : microphone ou caméra utilisés longtemps, programme dont la mémoire ne cesse d'augmenter, disque presque plein. Cliquez pour les configurer."
