[package]
name = "windows-stats"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Windows Stats: system resource widgets for the Windows 10/11 taskbar (based on winstats)"
license = "MIT"
# Windows Stats is a fork of winstats by Oleksandr Zhabotynskyi (https://github.com/mgvs/winstats, MIT)
authors = ["Windows Stats contributors", "Oleksandr Zhabotynskyi <alexlp@mgvs.org>"]
build = "build.rs"
publish = false

[[bin]]
name = "WindowsStats"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.9"
# the #[implement] macro (COM objects such as the DirectWrite text renderer) expands to windows_core paths
windows-core = "=0.58.0"

[dependencies.windows]
version = "=0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_DirectWrite",
    "implement",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_ProcessStatus",
    "Win32_Globalization",
    "Win32_NetworkManagement_WiFi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Wdk_System_SystemInformation",
    "Wdk_System_SystemServices",
    "Wdk_Graphics_Direct3D",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_System_Recovery",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_Security",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
