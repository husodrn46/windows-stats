name: Feature request / Özellik önerisi
description: Suggest an improvement to Windows Stats.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: English or Turkish is welcome. Describe your use case.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: windows
    attributes:
      label: Windows version and OS build (if relevant)
