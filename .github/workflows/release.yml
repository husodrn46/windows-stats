name: Release package

# Pushing a tag such as v0.1.1 builds the release package on a clean GitHub-hosted Windows
# machine and attaches it to a DRAFT release. A maintainer reviews the draft and publishes it,
# so every merged security fix can reach users without a local toolchain.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build, test and draft the release
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that tag, Cargo.toml and sensor helper agree
        id: version
        run: |
          $tag = '${{ github.ref_name }}'
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tag -ne "v$version") { throw "Tag $tag does not match Cargo.toml version $version" }
          $helper = (Select-String -Path helpers/sensors/Program.cs -Pattern 'const string Version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($helper -ne $version) { throw "Sensor helper version $helper does not match $version" }
          if (-not (Test-Path "docs/release-notes/$version.md")) { throw "docs/release-notes/$version.md is missing" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare pinned Rust and Windows resource compiler
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.99.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $resourceCompiler = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\rc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $resourceCompiler) { throw 'Windows SDK rc.exe is missing' }
          $resourceCompiler.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and test
        run: |
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package with the project build script
        run: |
          ./scripts/build.ps1
          git diff --exit-code -- Cargo.toml Cargo.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the packaged archive
        id: archive
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $archive = (Resolve-Path "dist/WindowsStats-$version-x64.zip").Path
          $check = Join-Path $env:RUNNER_TEMP 'release-check'
          Expand-Archive $archive -DestinationPath $check
          foreach ($relative in @('WindowsStats.exe', 'Kur.cmd', 'sensors/WindowsStats.Sensors.exe', 'LICENSE.txt', 'THIRD-PARTY-NOTICES.txt')) {
            if (-not (Test-Path (Join-Path $check $relative))) { throw "Release file missing: $relative" }
          }
          ./scripts/ci-smoke.ps1 -Executable (Join-Path $check 'WindowsStats.exe') -WorkDirectory "$env:RUNNER_TEMP/release-cli" -ExpectedVersion $version
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash
          "Archive SHA-256: ``$hash``" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "path=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Get-Content "docs/release-notes/$version.md" -Raw | Set-Content $notes -Encoding utf8
          "`nArchive SHA-256: ``${{ steps.archive.outputs.sha256 }}``" | Add-Content $notes -Encoding utf8
          gh release create '${{ github.ref_name }}' '${{ steps.archive.outputs.path }}' --draft --verify-tag --title "Windows Stats $version" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
