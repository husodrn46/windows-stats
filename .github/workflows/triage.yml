name: Label issues and pull requests

on:
  issues:
    types: [opened]
  # Fork contributions need a base-repo token to add labels. Never run PR code here.
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: triage-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
      # Adding a label to a pull request needs pull-requests: write; issues: write alone
      # returns 403. The job still never checks out or runs pull request code.
      pull-requests: write
    steps:
      - name: Check out trusted automation only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Add relevant labels
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { triage } = require('./.github/scripts/triage.cjs');
            await triage({ github, context, core });
